<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>
    <style>
        table{
            width:80vw;
            border-collapse:collapse;
            margin:auto;

        }
        th,td{
            border:2px solid red;
            text-align:center;
        }
    </style>
    <script>
        let rate=0;
        const url="https://dummyjson.com/products?limit=50&skip=6";
        async function loadproducts(){
            try{
                const response = await fetch(url);
                console.log("res=",response);
                const data = await response.json();
                console.log("data=",data.products);
                let rows="";
                data.products.map((i,index)=>(
                    rows+=`<tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}" width="100px" height="100px"/></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>₹${(i.price*rate).toFixed(2)}</td>
                        <td>${i.stock}</td>
                        <td><button>Add to cart</button></td>
                    </tr>`
                ))
                const el=document.getElementById("data");
                el.innerHTML=rows;
            }
            catch(err){
                console.log("err=",err);
            }
        }
        async function getRate(){
            URL="https://open.er-api.com/v6/latest/USD";
            try{
            const response=await fetch(URL);
            const data=await response.json();
            console.log("INR rate:", data.rates.INR);
            return data.rates.INR;

            }
            catch(err){
                console.log("err=",err);
            }
        }
        const test=async()=>{
            rate=await getRate();
            console.log("rate=",rate);
        }
        loadproducts();
        test();
    </script>
</head>
<body>
    <h1><center>List of Products</center></h1>
    <table border>
        <thead>
            <tr>
                <th>SR.no</th>
                <th>Title</th>
                <th>image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>price(rupees)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>

        </thead>
        <tbody id="data">
        
        </tbody>
    </table>
</body>
</html>
